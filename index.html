    .home-hero-right{
      display:flex !important;
      align-items:center !important;
      justify-content:flex-end !important;
      min-width:0 !important;
      text-align:center !important;

    .home-clock-panel{
      width:max-content !important;
      max-width:100% !important;
      margin-left:auto !important;
      margin-right:8px !important;
      display:flex !important;
      flex-direction:column !important;
      align-items:stretch !important;
    }
    .home-clock-panel .home-date{
      order:0 !important;
      width:100% !important;
      box-sizing:border-box !important;
      margin:0 0 7px 0 !important;
      padding:0 !important;
      text-align:right !important;
      transform:translateX(-8px) !important;
      font-size:clamp(16px,3.1vw,22px) !important;
      font-weight:1100 !important;
      line-height:1.1 !important;
      letter-spacing:-.55px !important;
      color:#0b1428 !important;
      white-space:nowrap !important;
    }
    .home-clock-panel .home-time{
      order:1 !important;
      position:relative !important;
      isolation:isolate !important;
      display:flex !important;
      align-items:center !important;
      justify-content:center !important;
      width:max-content !important;
      max-width:100% !important;
      min-height:0 !important;
      box-sizing:border-box !important;
      padding:14px 16px 13px !important;
      border:7px solid #cfd6e1 !important;
      border-radius:25px !important;
      border-color:#dde3ea #cbd3dd #aeb8c5 !important;
      background:
        linear-gradient(180deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.018) 24%,rgba(255,255,255,0) 42%),
        radial-gradient(circle at 30% 18%,rgba(255,255,255,.085),rgba(255,255,255,0) 38%),
        linear-gradient(180deg,#171a20 0%,#07090c 58%,#020305 100%) !important;
      box-shadow:
        0 0 0 1px rgba(73,83,96,.92),
        0 8px 17px rgba(15,23,42,.22),
        0 2px 5px rgba(15,23,42,.12),
        inset 0 1px 0 rgba(255,255,255,.105),
        inset 0 0 0 2px rgba(255,255,255,.035),
        inset 0 -11px 25px rgba(0,0,0,.45) !important;
      overflow:hidden !important;
    }
    .home-clock-panel .home-time::before{
      content:"" !important;
      position:absolute !important;
      inset:4px !important;
      z-index:0 !important;
      border:1px solid rgba(255,255,255,.065) !important;
      border-radius:14px !important;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.035) !important;
      pointer-events:none !important;
    }
    .home-clock-panel .home-time::after{
      content:"" !important;
      position:absolute !important;
      left:8px !important;
      right:8px !important;
      top:6px !important;
      height:34% !important;
      z-index:0 !important;
      border-radius:12px 12px 42% 42% !important;
      background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.012) 58%,rgba(255,255,255,0)) !important;
      opacity:.72 !important;
      pointer-events:none !important;
    }
    .home-clock-panel .home-time .seg-clock{
      --seg:#fff7d2 !important;
      position:relative !important;
      z-index:1 !important;
      display:flex !important;
      align-items:center !important;
      justify-content:center !important;
      gap:clamp(4px,.75vw,6px) !important;
    }
    .home-clock-panel .home-time .seg-digit{
      width:clamp(42px,8.3vw,66px) !important;
      height:clamp(76px,14.5vw,112px) !important;
    }
    .home-clock-panel .home-time .seg-colon{
      flex-basis:clamp(9px,1.6vw,13px) !important;
      width:clamp(9px,1.6vw,13px) !important;
      height:clamp(76px,14.5vw,112px) !important;
    }
    .home-clock-panel .home-time .seg-digit .seg.on,
    .home-clock-panel .home-time .seg-colon::before,
    .home-clock-panel .home-time .seg-colon::after{
      background:linear-gradient(180deg,#fffdf0 0%,#fff7d2 62%,#e9ddb0 100%) !important;
      box-shadow:
        0 0 2px rgba(255,247,210,.58),
        0 0 8px rgba(255,247,210,.18),
        inset 0 1px 0 rgba(255,255,255,.24),
        inset 0 -1px 1px rgba(112,91,30,.10) !important;
      filter:none !important;
    }
    .home-clock-panel .home-time .seg-digit .seg:not(.on){
      opacity:1 !important;
      visibility:visible !important;
      background:rgba(255,247,210,.052) !important;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.014),
        0 0 4px rgba(255,247,210,.014) !important;
    }
    .home-clock-panel .home-time .seg-colon::before,
    .home-clock-panel .home-time .seg-colon::after{
      width:clamp(7px,1.25vw,10px) !important;
      height:clamp(9px,1.7vw,13px) !important;
      border-radius:50% !important;
      will-change:opacity,box-shadow !important;
      animation:clockColonBreath 1.18s cubic-bezier(.45,0,.55,1) infinite !important;
    }
    @keyframes clockColonBreath{
      0%,34%{opacity:1;box-shadow:0 0 2px rgba(255,247,210,.58),0 0 8px rgba(255,247,210,.18),inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 1px rgba(112,91,30,.10);}
      56%{opacity:.62;box-shadow:0 0 2px rgba(255,247,210,.30),0 0 5px rgba(255,247,210,.10),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 1px rgba(112,91,30,.06);}
      74%,91%{opacity:.16;box-shadow:0 0 2px rgba(255,247,210,.08),0 0 3px rgba(255,247,210,.025),inset 0 1px 0 rgba(255,255,255,.04),inset 0 -1px 1px rgba(112,91,30,.025);}
      100%{opacity:.46;box-shadow:0 0 2px rgba(255,247,210,.22),0 0 4px rgba(255,247,210,.07),inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 1px rgba(112,91,30,.05);}
    }
    @media (prefers-reduced-motion:reduce){
      .home-clock-panel .home-time .seg-colon::before,
      .home-clock-panel .home-time .seg-colon::after{animation:none !important;opacity:.82 !important;}
    }

    /* 날씨 카드 미세 위치 조정: 배경 애니메이션은 시계와의 중앙으로, 표시값은 조금 아래로 */
    .home-hero-fx > .wxfx-glow{
      margin-left:0 !important;
    }
    .home-hero-fx.is-night > .wxfx-glow{
      background:radial-gradient(circle, rgba(202,224,255,.28), rgba(202,224,255,0) 70%) !important;
      filter:blur(1px);
    }
    .home-hero-fx .wxfx-moon{
      position:absolute;
      display:block;
      left:clamp(18px,4vw,54px);
      top:clamp(20px,3vw,38px);
      width:clamp(72px,9vw,122px);
      aspect-ratio:1;
      overflow:hidden;
      border-radius:50%;
      background:
        radial-gradient(circle at 29% 32%, rgba(112,128,143,.34) 0 5%, transparent 6%),
        radial-gradient(circle at 67% 27%, rgba(126,141,154,.25) 0 4%, transparent 5%),
        radial-gradient(circle at 63% 67%, rgba(104,122,138,.28) 0 7%, transparent 8%),
        radial-gradient(circle at 36% 73%, rgba(151,164,174,.22) 0 4%, transparent 5%),
        radial-gradient(circle at 34% 27%, #fffef1 0%, #edf3f6 40%, #c5d1da 76%, #9fb0bd 100%);
      box-shadow:
        0 0 0 1px rgba(239,247,255,.58),
        0 0 18px rgba(205,227,255,.58),
        0 0 42px rgba(155,195,245,.34),
        inset -8px -10px 16px rgba(82,101,119,.18),
        inset 5px 5px 10px rgba(255,255,255,.32);
      animation:homeMoonFloat 5.2s ease-in-out infinite;
    }
    .home-hero-fx .wxfx-moon::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(circle at 43% 48%, rgba(83,101,117,.22) 0 3%, transparent 4%),
        radial-gradient(circle at 75% 48%, rgba(91,108,123,.18) 0 5%, transparent 6%),
        radial-gradient(circle at 48% 18%, rgba(255,255,255,.22) 0 3%, transparent 4%);
      z-index:1;
    }
    .home-hero-fx .wxfx-moon::after{
      content:"";
      position:absolute;
      inset:-1px;
      z-index:2;
      border-radius:50%;
      background:radial-gradient(circle at 34% 28%, rgba(105,137,171,.92) 0%, rgba(48,75,105,.94) 52%, rgba(22,43,70,.96) 100%);
      box-shadow:
        inset -7px -7px 14px rgba(4,14,28,.26),
        inset 4px 4px 9px rgba(190,218,247,.14),
        0 0 5px rgba(170,208,250,.20);
      filter:blur(.15px);
    }
    .home-hero-fx .moon-new::after,
    .home-moon-mini.moon-new::after{opacity:.88;transform:translateX(0);}
    .home-hero-fx .moon-waxing-crescent::after,
    .home-moon-mini.moon-waxing-crescent::after{opacity:.90;transform:translateX(-16%);}
    .home-hero-fx .moon-first-quarter::after,
    .home-moon-mini.moon-first-quarter::after{opacity:.90;transform:none;clip-path:inset(0 50% 0 0);}
    .home-hero-fx .moon-waxing-gibbous::after,
    .home-moon-mini.moon-waxing-gibbous::after{opacity:.90;transform:translateX(-68%);}
    .home-hero-fx .moon-full::after,
    .home-moon-mini.moon-full::after{opacity:0;}
    .home-hero-fx .moon-waning-gibbous::after,
    .home-moon-mini.moon-waning-gibbous::after{opacity:.90;transform:translateX(68%);}
    .home-hero-fx .moon-last-quarter::after,
    .home-moon-mini.moon-last-quarter::after{opacity:.90;transform:none;clip-path:inset(0 0 0 50%);}
    .home-hero-fx .moon-waning-crescent::after,
    .home-moon-mini.moon-waning-crescent::after{opacity:.90;transform:translateX(16%);}
    .home-wx-icon.has-moon-phase{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .home-moon-mini{
      position:relative;
      display:block;
      width:.86em;
      aspect-ratio:1;
      overflow:hidden;
      border-radius:50%;
      background:
        radial-gradient(circle at 30% 33%, rgba(103,120,136,.32) 0 6%, transparent 7%),
        radial-gradient(circle at 66% 66%, rgba(100,118,134,.24) 0 7%, transparent 8%),
        radial-gradient(circle at 34% 27%, #fffef1 0%, #edf3f6 42%, #bdcbd5 100%);
      box-shadow:
        0 0 0 1px rgba(218,234,250,.72),
        0 0 9px rgba(153,197,247,.48),
        inset -4px -5px 8px rgba(75,94,111,.16);
    }
    .home-moon-mini::after{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:50%;
      background:radial-gradient(circle at 34% 28%, rgba(111,145,179,.90) 0%, rgba(52,80,111,.93) 54%, rgba(24,47,75,.95) 100%);
      box-shadow:inset -4px -4px 8px rgba(4,14,28,.22), inset 2px 2px 5px rgba(196,222,248,.14);
    }
    @keyframes homeMoonFloat{
      0%,100%{transform:translateY(0) rotate(-1deg);}
      50%{transform:translateY(-4px) rotate(1deg);}
    }
    .home-hero-fx .wxfx-moon-emoji{
      position:absolute;
      display:flex;
      align-items:center;
      justify-content:center;
      left:clamp(18px,4vw,54px);
      top:clamp(20px,3vw,38px);
      width:clamp(72px,9vw,122px);
      height:clamp(72px,9vw,122px);
      font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
      font-size:clamp(72px,9vw,122px);
      font-style:normal;
      line-height:1;
      filter:drop-shadow(0 0 11px rgba(205,226,255,.62)) drop-shadow(0 7px 12px rgba(38,59,83,.20));
      animation:homeMoonFloat 5.2s ease-in-out infinite;
    }
    .home-hero-left{
      transform:translateY(9px);
    }
    .home-wx-temp{
      font-size:26px !important;
    }
    @media (max-width:360px){
      .home-hero-fx .wxfx-moon{
        left:15px;
        top:24px;
        width:72px;
      }
      .home-hero-fx .wxfx-moon-emoji{
        left:15px;

        font-size:72px;
      }
      .home-hero-left{
        transform:translateY(8px);
      }
      .home-wx-temp{
        font-size:23px !important;
      }
    }
  </style>

      if(title && /연락처/.test(title.textContent || '')) title.textContent = '직원·임무 입력';
    }catch(e){}
  }

  document.addEventListener('click', function(ev){
    var target = ev.target;
    if(isWithin(target, '#tbmMinutesPrint') || isWithin(target, '#tbmMinutesEasyPrint')){
      markMinutesPrintReturnGuard();
    }
  }, true);

  window.addEventListener('beforeprint', markMinutesPrintReturnGuard);

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ applyPatch(document); });
  }else{
    applyPatch(document);
  }

  try{
    var mo = new MutationObserver(function(records){
      records.forEach(function(rec){
        Array.prototype.forEach.call(rec.addedNodes || [], function(node){
          if(node && node.nodeType === 1) applyPatch(node);
        });
      });
    });
    mo.observe(document.documentElement, { childList:true, subtree:true });
  }catch(e){}
})();
</script>

<script>
/* 날씨 화면: 안산시 고정 제거 → 현재 위치 기반 */
(function(){
  function hasLocConsent(){
    try{ return (typeof window.hasLocationConsent === 'function') ? !!window.hasLocationConsent() : true; }catch(e){ return false; }
  }
  function showWeatherConsentBlocked(msg){
    if(typeof window.renderWeatherBlockedByConsent === 'function'){
      window.renderWeatherBlockedByConsent(msg || '위치정보 이용 동의 후 현재 위치 기준 날씨가 표시됩니다.');
      return;
    }
    var set = function(id, text){ var el = document.getElementById(id); if(el) el.textContent = text; };
    set('wxLoc','위치정보 동의 필요');
    set('wxNow','날씨정보 표시 안 함');
    set('wxTime','-');
    set('wxIcon','📍');
    set('wxFeel','체감 -°');
    set('wxHum','-');
    set('wxWind','-');
    set('wxTemp','-°');
    set('wxSource', msg || '위치정보 이용 동의 후 현재 위치 기준 날씨가 표시됩니다.');
  }
  function loadHere(){
    if(!hasLocConsent()){
      showWeatherConsentBlocked();
      if(typeof window.requireLocationConsent === 'function') window.requireLocationConsent('날씨정보');
      return;
    }
    if(!navigator.geolocation){
      showWeatherConsentBlocked('이 기기에서는 위치 기능을 사용할 수 없어 날씨정보를 표시하지 않습니다.');
      alert('이 기기에서는 위치 기능을 사용할 수 없습니다.');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      function(pos){
        if(typeof window.loadWeather === 'function'){
          window.loadWeather('현재 위치', pos.coords.latitude, pos.coords.longitude);
        }
      },
      function(){
        showWeatherConsentBlocked('브라우저 위치 권한이 필요합니다. 위치 권한을 허용해야 날씨정보가 표시됩니다.');
        alert('위치 권한이 필요합니다.\n(iOS: 설정 → Safari → 위치 → 허용)');
      },
      { enableHighAccuracy:true, timeout:10000, maximumAge:60000 }
    );
  }

  // initWeather를 덮어써서(기존 안산시 버튼/초기값 무시)
  window.initWeather = function(){
    var btnCity = document.getElementById('btnCity');
    var btnHere = document.getElementById('btnHere');

    if(btnCity){
      btnCity.hidden = true;
      btnCity.style.display = 'none';
    }
    if(btnHere){
      btnHere.classList.add('active');
      btnHere.onclick = loadHere;
    }
    if(!hasLocConsent()){
      showWeatherConsentBlocked();
      return;
    }
    loadHere();
  };

  // 혹시 최초 진입이 날씨 화면(#/weather)이라면 한번 더 갱신
  if(String(location.hash||'').indexOf('#/weather') === 0){
    setTimeout(function(){ try{ window.initWeather(); }catch(e){} }, 0);
  }
})();
</script>

<script>
(function(){
  const days = ['일','월','화','수','목','금','토'];
  const pad2 = (n)=>String(n).padStart(2,'0');

  const GEO_KEY = 'tbm_home_coords_v2';
  const WX_KEY  = 'tbm_home_lastwx_v2';
  const ALERT_KEY = 'tbm_home_wx_alert_v10';
  const ALERT_SEEN_KEY = 'tbm_home_wx_alert_seen_v8';
  const FETCH_INTERVAL = 10 * 60 * 1000; // 10분

  let lastWx = null;
  let lastAlert = null;
  let lastAlertFetchTs = 0;
  let pendingEnsureRetry = null;
  let pendingAlertRetry = null;
  let alertAutoCollapseTimer = null;
  let lastHeroCelestialKey = '';

  function isHomeReady(){
    return !!document.getElementById('homeHero');
  }

  function isLikelyHomeRoute(){
    const h = String(location.hash || '');
    return h === '' || h === '#/' || h.indexOf('#/home') === 0;
  }


  function locationConsentAllowed(){
    try{
      if(typeof window.hasLocationConsent === 'function') return !!window.hasLocationConsent();
    }catch(e){}
    return false;
  }

  function renderHomeWeatherBlocked(){
    lastWx = null;
    lastAlert = null;
    lastAlertFetchTs = 0;
    try{ localStorage.removeItem(WX_KEY); }catch(e){}
    try{ localStorage.removeItem(ALERT_KEY); }catch(e){}

    const hero = document.getElementById('homeHero');
    const tempEl = document.getElementById('homeWxTemp');
    const descEl = document.getElementById('homeWxDesc');
    const iconEl = document.getElementById('homeWxIcon');
    if(iconEl){
      iconEl.classList.remove('has-moon-phase');
      iconEl.textContent = '📍';
    }
    if(descEl) descEl.textContent = '위치동의 필요';
    if(tempEl) tempEl.textContent = '-';
    if(hero){
      hero.classList.remove(...HOME_HERO_WEATHER_CLASSES);
      hero.classList.add('wx-cloudy');
      renderHomeHeroFx({fx:'cloudy'}, false);
    }
    renderHomeWxAlert(null);
  }

  function scheduleEnsureWeather(delay){
    if(pendingEnsureRetry) clearTimeout(pendingEnsureRetry);
    pendingEnsureRetry = setTimeout(()=>{
      pendingEnsureRetry = null;
      ensureWeather();
    }, Math.max(0, Number(delay) || 0));
  }

  const HOME_SEGMENT_DIGIT_MAP = {
    "0":["a","b","c","d","e","f"],
    "1":["b","c"],
    "2":["a","b","d","e","g"],
    "3":["a","b","c","d","g"],
    "4":["b","c","f","g"],
    "5":["a","c","d","f","g"],
    "6":["a","c","d","e","f","g"],
    "7":["a","b","c"],
    "8":["a","b","c","d","e","f","g"],
    "9":["a","b","c","d","f","g"]
  };

  const HOME_HERO_WEATHER_CLASSES = ['wx-sunny','wx-cloudy','wx-overcast','wx-rain','wx-shower','wx-sleet','wx-snow','wx-fog','wx-thunder','wx-heat','wx-night'];

  const HOME_MOON_PHASES = [
    { className:'moon-new', label:'삭', emoji:'🌑' },
    { className:'moon-waxing-crescent', label:'초승달', emoji:'🌒' },
    { className:'moon-first-quarter', label:'상현달', emoji:'🌓' },
    { className:'moon-waxing-gibbous', label:'차오르는 달', emoji:'🌔' },
    { className:'moon-full', label:'보름달', emoji:'🌕' },
    { className:'moon-waning-gibbous', label:'기우는 달', emoji:'🌖' },
    { className:'moon-last-quarter', label:'하현달', emoji:'🌗' },
    { className:'moon-waning-crescent', label:'그믐달', emoji:'🌘' }
  ];

  function getHomeMoonPhase(date){
    const now = date instanceof Date ? date : new Date();
    const synodicDays = 29.530588853;
    const knownNewMoonUtc = Date.UTC(2000, 0, 6, 18, 14);
    const elapsedDays = (now.getTime() - knownNewMoonUtc) / 86400000;
    const ageDays = ((elapsedDays % synodicDays) + synodicDays) % synodicDays;
    const index = Math.floor((ageDays / synodicDays) * 8 + 0.5) % 8;
    return { ...HOME_MOON_PHASES[index], index, ageDays };
  }

  function getHomeCelestialCoords(wx){
    let lat = Number(wx && (wx.latitude != null ? wx.latitude : wx.lat));
    let lon = Number(wx && (wx.longitude != null ? wx.longitude : wx.lon));
    if(Number.isFinite(lat) && Number.isFinite(lon)) return { lat, lon };
    try{
      const saved = JSON.parse(localStorage.getItem(GEO_KEY) || 'null');
      lat = Number(saved && saved.lat);
      lon = Number(saved && saved.lon);
      if(Number.isFinite(lat) && Number.isFinite(lon)) return { lat, lon };
    }catch(e){}
    return null;
  }

  function getHomeSolarMinutes(date, latitude, longitude){
    const now = date instanceof Date ? date : new Date();
    const lat = Number(latitude);
    const lon = Number(longitude);
    if(!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 66.5) return null;
    const radians = Math.PI / 180;
    const degrees = 180 / Math.PI;
    const yearStart = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - yearStart) / 86400000);
    const longitudeHour = lon / 15;
    const calculate = isSunrise=>{
      const approximate = dayOfYear + (((isSunrise ? 6 : 18) - longitudeHour) / 24);
      const meanAnomaly = (0.9856 * approximate) - 3.289;
      let trueLongitude = meanAnomaly
        + (1.916 * Math.sin(meanAnomaly * radians))
        + (0.020 * Math.sin(2 * meanAnomaly * radians))
        + 282.634;
      trueLongitude = (trueLongitude + 360) % 360;
      let rightAscension = Math.atan(0.91764 * Math.tan(trueLongitude * radians)) * degrees;
      rightAscension = (rightAscension + 360) % 360;
      rightAscension += Math.floor(trueLongitude / 90) * 90 - Math.floor(rightAscension / 90) * 90;
      rightAscension /= 15;
      const sinDeclination = 0.39782 * Math.sin(trueLongitude * radians);
      const cosDeclination = Math.cos(Math.asin(sinDeclination));
      const cosHour = (Math.cos(90.833 * radians) - (sinDeclination * Math.sin(lat * radians)))
        / (cosDeclination * Math.cos(lat * radians));
      if(cosHour < -1 || cosHour > 1) return null;
      let localHour = isSunrise ? 360 - (Math.acos(cosHour) * degrees) : Math.acos(cosHour) * degrees;
      localHour /= 15;
      const localMeanTime = localHour + rightAscension - (0.06571 * approximate) - 6.622;
      const utcHour = ((localMeanTime - longitudeHour) % 24 + 24) % 24;
      const localClockHour = ((utcHour - (now.getTimezoneOffset() / 60)) % 24 + 24) % 24;
      return Math.round(localClockHour * 60);
    };
    const sunrise = calculate(true);
    const sunset = calculate(false);
    return Number.isFinite(sunrise) && Number.isFinite(sunset) ? { sunrise, sunset } : null;
  }

  function getHomeCelestialState(date, wx){
    const now = date instanceof Date ? date : new Date();
    const coords = getHomeCelestialCoords(wx);
    const solar = coords ? getHomeSolarMinutes(now, coords.lat, coords.lon) : null;
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const month = now.getMonth() + 1;
    const fallbackSunrise = (month >= 5 && month <= 8) ? 5 * 60 : ((month === 11 || month === 12 || month <= 2) ? 7 * 60 : 6 * 60);
    const fallbackSunset = (month >= 5 && month <= 8) ? 20 * 60 : ((month === 11 || month === 12 || month <= 2) ? 18 * 60 : 19 * 60);
    const sunrise = solar ? solar.sunrise : fallbackSunrise;
    const sunset = solar ? solar.sunset : fallbackSunset;
    const isNight = currentMinutes < sunrise || currentMinutes >= sunset;
    const moon = getHomeMoonPhase(now);
    return { isNight, moon, sunrise, sunset, key:isNight ? `night-${moon.index}` : 'day' };
  }

  function renderHomeHeroFx(bucket, isNight, moonPhase){
    const fx = document.getElementById('homeHeroFx');
    if(!fx) return;
    const type = String((bucket && (bucket.fx || bucket.cls)) || 'sunny').replace(/^wx-/, '');
    const phase = moonPhase || getHomeMoonPhase(new Date());
    fx.className = `home-hero-fx is-${type}${isNight ? ' is-night' : ''}`;
    const clouds = '<i class="wxfx-cloud c1"></i><i class="wxfx-cloud c2"></i><i class="wxfx-cloud c3"></i>';
    const darkClouds = '<i class="wxfx-cloud dark c1"></i><i class="wxfx-cloud dark c2"></i>';
    const rain = '<i class="wxfx-rain r1"></i><i class="wxfx-rain r2"></i><i class="wxfx-rain r3"></i><i class="wxfx-rain r4"></i><i class="wxfx-rain r5"></i><i class="wxfx-rain r6"></i><i class="wxfx-rain r7"></i><i class="wxfx-rain r8"></i>';
    const shower = rain.replaceAll('wxfx-rain ', 'wxfx-rain shower ');
    const snow = '<i class="wxfx-snow s1"></i><i class="wxfx-snow s2"></i><i class="wxfx-snow s3"></i><i class="wxfx-snow s4"></i><i class="wxfx-snow s5"></i><i class="wxfx-snow s6"></i>';
    const stars = isNight ? '<i class="wxfx-star t1"></i><i class="wxfx-star t2"></i><i class="wxfx-star t3"></i>' : '';
    const moon = `<i class="wxfx-moon-emoji" data-phase="${phase.index}">${phase.emoji}</i>`;
    let html = '';
    if(type === 'sunny') html = isNight ? '<i class="wxfx-glow"></i>' + moon + stars : '<i class="wxfx-glow"></i><i class="wxfx-sun"></i>';
    else if(type === 'heat') html = (isNight ? '<i class="wxfx-glow"></i>' + moon + stars : '<i class="wxfx-glow"></i><i class="wxfx-sun"></i>') + '<i class="wxfx-heat h1"></i><i class="wxfx-heat h2"></i><i class="wxfx-heat h3"></i><i class="wxfx-heat h4"></i>';
    else if(type === 'cloudy') html = isNight ? '<i class="wxfx-glow"></i>' + moon + clouds + stars : '<i class="wxfx-glow cloudy-sun"></i><i class="wxfx-sun partial-cloudy"></i>' + clouds;
    else if(type === 'overcast') html = clouds;
    else if(type === 'rain') html = darkClouds + rain;
    else if(type === 'shower') html = darkClouds + shower;
    else if(type === 'sleet') html = clouds + rain + snow;
    else if(type === 'snow') html = clouds + snow;
    else if(type === 'fog') html = '<i class="wxfx-fog f1"></i><i class="wxfx-fog f2"></i><i class="wxfx-fog f3"></i>';
    else if(type === 'thunder') html = darkClouds + shower + '<i class="wxfx-bolt"></i><i class="wxfx-flash"></i>';
    else html = clouds;
    fx.innerHTML = html;
  }

  function renderHomeSevenSegmentTime(value){
    return `<span class="seg-clock" aria-hidden="true">${String(value || '').split('').map(ch=>{
      if(ch === ':') return '<span class="seg-colon"></span>';
      const active = HOME_SEGMENT_DIGIT_MAP[ch] || [];
      return `<span class="seg-digit" data-digit="${ch}">${['a','b','c','d','e','f','g'].map(seg=>`<i class="seg ${seg}${active.includes(seg) ? ' on' : ''}"></i>`).join('')}</span>`;
    }).join('')}</span>`;
  }

  function tick(){
    const tEl = document.getElementById('homeTime');
    const dEl = document.getElementById('homeDate');
    if(!tEl || !dEl) return;

    const now = new Date();
    const hh = pad2(now.getHours());
    const mm = pad2(now.getMinutes());
    const timeLabel = `${hh}:${mm}`;

    tEl.classList.add('seven-seg-ready');
    tEl.innerHTML = renderHomeSevenSegmentTime(timeLabel);
    tEl.setAttribute('aria-label', `현재 시간 ${timeLabel}`);
    dEl.textContent = `${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;

    const celestial = getHomeCelestialState(now, lastWx);
    if(lastWx && lastHeroCelestialKey && celestial.key !== lastHeroCelestialKey && isHomeReady()){
      applyHero(lastWx);
    }
  }

  // 기상청(KMA) PTY/SKY → 표시/배경 및 애니메이션 분류
  // PTY: 0 없음, 1 비, 2 비/눈, 3 눈, 4 소나기, 5 빗방울, 6 빗방울/눈날림, 7 눈날림
  // SKY: 1 맑음, 3 구름많음, 4 흐림
  function bucketFromKma(pty, sky, temp, rawText){
    const p = Number(pty);
    const s = Number(sky);
    const t = Number(temp);
    const hint = String(rawText || '');
    if(/천둥|번개|뇌우/.test(hint)) return { icon:'⛈️', label:'천둥번개', cls:'wx-thunder', fx:'thunder' };
    if(/안개|박무|연무/.test(hint)) return { icon:'🌫️', label:'안개', cls:'wx-fog', fx:'fog' };
    if(isFinite(p) && p !== 0){
      if(p===3 || p===7) return { icon:'❄️', label:'눈', cls:'wx-snow', fx:'snow' };
      if(p===2 || p===6) return { icon:'🌨️', label:'비/눈', cls:'wx-sleet', fx:'sleet' };
      if(p===4) return { icon:'🌦️', label:'소나기', cls:'wx-shower', fx:'shower' };
      if(p===1 || p===5) return { icon:'🌧️', label:'비', cls:'wx-rain', fx:'rain' };
      return { icon:'🌧️', label:'강수', cls:'wx-rain', fx:'rain' };
    }
    if(s===4) return { icon:'☁️', label:'흐림', cls:'wx-overcast', fx:'overcast' };
    if(s===3) return { icon:'⛅', label:'구름많음', cls:'wx-cloudy', fx:'cloudy' };
    if(isFinite(t) && t >= 33) return { icon:'☀️', label:'맑음', cls:'wx-heat', fx:'heat' };
    return { icon:'☀️', label:'맑음', cls:'wx-sunny', fx:'sunny' };
  }

  function htmlSafe(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  function compactAreaText(text){
    const s = String(text || '').replace(/\s+/g, ' ').trim();
    if(!s) return '';
    return s.length > 95 ? `${s.slice(0, 95)}…` : s;
  }

  function formatKmaTime(v){
    const s = String(v || '').replace(/\D/g, '');
    if(s.length < 8) return '';
    const y = s.slice(0,4), mo = s.slice(4,6), d = s.slice(6,8);
    const hh = s.length >= 10 ? s.slice(8,10) : '';
    const mm = s.length >= 12 ? s.slice(10,12) : '';
    return `${Number(mo)}월 ${Number(d)}일${hh ? ` ${hh}:${mm || '00'}` : ''}`;
  }


  function isHeatImpactAlertItem(it){
    const text = String([it && it.type, it && it.source, it && it.kind, it && it.title].filter(Boolean).join(' '));
    return /heat_impact|ImpactInfoServiceV2|폭염\s*영향예보/i.test(text);
  }

  function isHeatSpecialWarningItem(it){
    const text = String([it && it.kind, it && it.title].filter(Boolean).join(' '));
    return /폭염\s*(주의보|경보)/.test(text);
  }

  function normalizeHomeImpactLevel(it){
    const raw = String((it && it.level) || '').toLowerCase();
    if(raw === 'danger' || /위험/.test(raw)) return 'danger';
    if(raw === 'warning' || /경고/.test(raw)) return 'warning';
    if(raw === 'caution' || raw === 'advisory' || /주의/.test(raw)) return 'caution';
    if(raw === 'attention' || /관심/.test(raw)) return 'attention';
    const text = String([it && it.kind, it && it.title].filter(Boolean).join(' '));
    if(/위험/.test(text)) return 'danger';
    if(/경고/.test(text)) return 'warning';
    if(/주의/.test(text)) return 'caution';
    if(/관심/.test(text)) return 'attention';
    if(/경보/.test(text)) return 'warning';
    return 'caution';
  }

  function homeImpactLevelLabel(level, it){
    const lv = String(level || '').toLowerCase();
    if(lv === 'danger') return '위험';
    if(lv === 'warning') return isHeatImpactAlertItem(it) ? '경고' : '경보';
    if(lv === 'caution') return '주의';
    if(lv === 'attention') return '관심';
    return '특보';
  }

  function heatImpactActionText(level){
    const lv = String(level || '').toLowerCase();
    const map = {
      attention: ['폭염 영향예보 확인', '물·그늘 준비 및 온열질환 예방수칙 게시', '취약 근로자·고강도 작업 사전 확인'],
      caution: ['시원한 물 제공', '매시간 10분 이상 그늘 휴식', '14~17시 옥외작업 축소 또는 작업시간 조정', '취약 근로자·고강도 작업자는 휴식 추가'],
      warning: ['시원한 물 제공', '매시간 15분 이상 그늘 휴식', '14~17시 가급적 옥외작업 중지', '온열질환 취약 근로자 작업 제한 검토'],
      danger: ['시원한 물 제공 및 수시 건강상태 확인', '매시간 15분 이상 그늘 휴식', '14~17시 재난·안전 긴급조치 외 옥외작업 중지', '열사병 취약 근로자는 옥외작업 제한']
    };
    return (map[lv] || map.attention).join('\n');
  }

  function multilineSafeHtml(v){
    return htmlSafe(v).replace(/\n/g, '<br>');
  }

  function wxNum(v){
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function calcHeatIndexC(tempC, humidity){
    const t = wxNum(tempC);
    const rh = wxNum(humidity);
    if(t == null) return null;
    if(rh == null || t < 27) return t;

    // NOAA/NWS heat index formula. Current KMA 체감온도와 완전히 같지는 않지만,
    // 영향예보 API가 없거나 지역 매칭에 실패할 때 현장 안전용 보조 알림으로 사용합니다.
    const tf = t * 9 / 5 + 32;
    const hiF = -42.379
      + 2.04901523 * tf
      + 10.14333127 * rh
      - 0.22475541 * tf * rh
      - 0.00683783 * tf * tf
      - 0.05481717 * rh * rh
      + 0.00122874 * tf * tf * rh
      + 0.00085282 * tf * rh * rh
      - 0.00000199 * tf * tf * rh * rh;
    const hiC = (hiF - 32) * 5 / 9;
    return Number.isFinite(hiC) ? Math.max(t, hiC) : t;
  }

  function yyyymmddFromDate(d){
    const x = d || new Date();
    return `${x.getFullYear()}${pad2(x.getMonth()+1)}${pad2(x.getDate())}`;
  }

  async function fetchWxWeekLite(lat, lon){
    try{
      const url = `/api/wx_week?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}`;
      const res = await fetch(url, { cache:'no-store' });
      if(!res.ok) throw new Error('wx_week_failed');
      const data = await res.json();
      if(!data || data.ok !== true) return null;
      return data;
    }catch(e){
      return null;
    }
  }

  function heatLevelFromWeather(wx, week){
    // 공식 기상청 폭염 영향예보가 아닌 현재기상 기반 보조 판정은 사용하지 않습니다.
    return null;
  }

  function buildHeatImpactData(wx, week, areaLabel){
    // 폭염 영향예보는 기상청 공식 ImpactInfoServiceV2 중 산업분야 응답만 표시합니다.
    // 현재기온·체감온도·최고기온 기반 보조 카드와 타 분야 영향예보는 생성하지 않습니다.
    return null;
  }

  function hasOfficialHeatImpact(data){
    const items = Array.isArray(data && data.items) ? data.items : [];
    return items.some(it=>{
      const source = String(it && it.source || '');
      const type = String(it && it.type || '');
      return source === 'ImpactInfoServiceV2' || type === 'heat_impact';
    });
  }

  function mergeWxAlertData(formalData, heatData){
    if(heatData && !hasOfficialHeatImpact(heatData)) heatData = null;
    const formalActive = !!(formalData && formalData.ok !== false && formalData.active && Array.isArray(formalData.items) && formalData.items.length);
    const heatActive = !!(heatData && heatData.ok !== false && heatData.active && Array.isArray(heatData.items) && heatData.items.length);
    if(!formalActive && !heatActive) return formalData || heatData || null;
    if(formalActive && !heatActive) return formalData;
    if(!formalActive && heatActive) return heatData;

    // 공식 폭염 영향예보가 들어온 경우에는 현재기온 기반 보조판정이 단계를 올려 보이게 하지 않습니다.
    // 예: 공식 '관심'인데 체감온도 보조판정이 '주의'로 표시되는 문제 방지.
    if(hasOfficialHeatImpact(formalData)) return formalData;

    const formalItems = Array.isArray(formalData.items) ? formalData.items : [];
    const heatItems = Array.isArray(heatData.items) ? heatData.items : [];
    const items = [...heatItems, ...formalItems];
    return {
      ...formalData,
      ok:true,
      active:true,
      title:'기상특보·폭염 영향예보',
      summary:[heatData.summary, formalData.summary].filter(Boolean).join(' · '),
      sourceLabel:'기상청 기상특보·산업분야 폭염 영향예보 기준',
      items,
      source:{ formal: formalData.source || null, heat: heatData.source || null }
    };
  }

  async function fetchHeatImpactFallback(lat, lon, areaLabel){
    // 공식 기상청 폭염 영향예보가 아닌 보조 판정은 표시하지 않습니다.
    return null;
  }

  function alertSignature(data){
    const items = Array.isArray(data && data.items) ? data.items : [];
    const parts = items.map(it=>[
      it.kind || it.title || '',
      it.level || '',
      it.areas || '',
      it.issuedAt || data.issuedAt || ''
    ].join('|'));
    return [data && data.issuedAt || '', data && data.statusTime || '', data && data.summary || '', parts.join('||')].join('::');
  }

  function clearAlertAutoCollapse(){
    if(alertAutoCollapseTimer){
      clearTimeout(alertAutoCollapseTimer);
      alertAutoCollapseTimer = null;
    }
  }

  function renderHomeWxAlert(data){
    const wrap = document.getElementById('homeWxAlert');
    if(!wrap) return;

    const active = !!(data && data.ok !== false && data.active && Array.isArray(data.items) && data.items.length);
    if(!active){
      clearAlertAutoCollapse();
      wrap.hidden = true;
      wrap.dataset.sig = '';
      wrap.dataset.level = '';
      return;
    }

    const titleEl = document.getElementById('homeWxAlertTitle');
    const summaryEl = document.getElementById('homeWxAlertSummary');
    const badgeEl = document.getElementById('homeWxAlertBadge');
    const metaEl = document.getElementById('homeWxAlertMeta');
    const listEl = document.getElementById('homeWxAlertList');
    const sourceEl = document.getElementById('homeWxAlertSource');
    const toggle = document.getElementById('homeWxAlertToggle');

    const items = Array.isArray(data.items) ? data.items : [];
    const sig = alertSignature(data);
    const isNewSignature = wrap.dataset.sig !== sig;
    const seenSig = (()=>{ try{ return localStorage.getItem(ALERT_SEEN_KEY) || ''; }catch(e){ return ''; } })();
    const isUnseenAlert = seenSig !== sig;
    const shouldOpen = isNewSignature ? isUnseenAlert : !wrap.classList.contains('collapsed');
    const primaryItem = items[0] || {};
    const primaryLevel = normalizeHomeImpactLevel(primaryItem);
    const primaryBadge = homeImpactLevelLabel(primaryLevel, primaryItem);
    const summary = data.summary || items.map(it=>it.kind || it.title).filter(Boolean).slice(0,2).join(' · ') || '기상특보 발령';
    const area = data.areaLabel || '현재 위치';
    const issued = formatKmaTime(data.issuedAt);
    const badgeText = data.badgeLabel || primaryBadge || '특보';

    wrap.dataset.level = primaryLevel || 'caution';

    if(titleEl) titleEl.textContent = data.title || '현재 위치 기상특보';
    if(summaryEl) summaryEl.textContent = summary;
    if(badgeEl) badgeEl.textContent = badgeText;
    if(metaEl) metaEl.textContent = `${area} 기준${issued ? ` · 발표 ${issued}` : ''}`;
    if(sourceEl) sourceEl.textContent = data.sourceLabel || '기상청 기상특보 조회서비스 기준';

    if(listEl){
      listEl.innerHTML = items.map(it=>{
        const itemTitle = it.kind || it.title || '기상특보';
        const areaText = compactAreaText(it.areas || it.matchedArea || area);
        const heatItem = isHeatImpactAlertItem(it);
        const heatSpecialWarning = isHeatSpecialWarningItem(it);
        const itemLevel = normalizeHomeImpactLevel(it);
        const detailText = String(heatItem ? '' : (it.detail || it.reason || '')).trim();
        const suppliedActions = Array.isArray(it.actions) ? it.actions.join('\n') : (it.actionDetail || it.actions || '');
        const actionText = String((heatItem || heatSpecialWarning) ? (suppliedActions || heatImpactActionText(itemLevel)) : '').trim();
        const areaLabel = it.areaLabel || '발효지역';
        return `
          <div class="home-wx-alert-item" data-level="${htmlSafe(itemLevel)}">
            <div class="home-wx-alert-item-title">${htmlSafe(itemTitle)}</div>
            ${detailText ? `<div class="home-wx-alert-item-area">${htmlSafe(detailText)}</div>` : ''}
            ${actionText ? `<div class="home-wx-alert-action"><div class="home-wx-alert-action-label">산업분야 조치사항</div><div class="home-wx-alert-action-text">${multilineSafeHtml(actionText)}</div></div>` : ''}
            <div class="home-wx-alert-item-area">${htmlSafe(areaLabel)}: ${htmlSafe(areaText || area)}</div>
          </div>
        `;
      }).join('');
    }

    wrap.hidden = false;
    wrap.dataset.sig = sig;
    wrap.classList.toggle('collapsed', !shouldOpen);
    if(toggle) toggle.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');

    // 새 특보는 처음 한 번 펼쳐서 보여준 뒤 자동으로 접습니다.
    // 같은 특보를 다시 볼 때는 접힌 상태로 시작하고, 사용자가 누르면 다시 펼쳐볼 수 있습니다.
    clearAlertAutoCollapse();
    if(shouldOpen){
      try{ localStorage.setItem(ALERT_SEEN_KEY, sig); }catch(e){}
      if(isUnseenAlert){
        alertAutoCollapseTimer = setTimeout(()=>{
          if(wrap.hidden || wrap.dataset.sig !== sig) return;
          wrap.classList.add('collapsed');
          if(toggle) toggle.setAttribute('aria-expanded', 'false');
        }, 6000);
      }
    }

    if(toggle && !toggle.dataset.bound){
      toggle.dataset.bound = '1';
      toggle.addEventListener('click', ()=>{
        clearAlertAutoCollapse();
        const nowCollapsed = !wrap.classList.contains('collapsed');
        wrap.classList.toggle('collapsed', nowCollapsed);
        toggle.setAttribute('aria-expanded', nowCollapsed ? 'false' : 'true');
        if(!nowCollapsed){
          try{ localStorage.setItem(ALERT_SEEN_KEY, wrap.dataset.sig || sig); }catch(e){}
        }
      });
    }
  }

  function scheduleAlertRetry(delay){
    if(pendingAlertRetry) clearTimeout(pendingAlertRetry);
    pendingAlertRetry = setTimeout(()=>{
      pendingAlertRetry = null;
      ensureHomeWxAlert();
    }, Math.max(0, Number(delay) || 0));
  }

  function isWxAlertDataActive(data){
    return !!(data && data.ok !== false && data.active && Array.isArray(data.items) && data.items.length);
  }

  async function fetchWxAlert(lat, lon){
    let info = null;
    try{
      if(typeof reverseGeocodeInfo === 'function') info = await reverseGeocodeInfo(lat, lon);
    }catch(e){ info = null; }

    const params = new URLSearchParams();
    params.set('latitude', String(lat));
    params.set('longitude', String(lon));
    if(info){
      if(info.label) params.set('area', info.label);
      if(info.city) params.set('city', info.city);
      if(info.district) params.set('district', info.district);
      if(info.dong) params.set('dong', info.dong);
      if(info.state) params.set('state', info.state);
    }

    const areaLabel = (info && info.label) || '현재 위치';
    // 날씨카드 아래에는 현재 위치에 발효 중인 공식 기상특보만 표시합니다.
    // 영향예보는 이 영역에서 사용하지 않습니다.
    let formalData = null;
    let formalError = null;
    try{
      const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const timer = controller ? setTimeout(()=>{ try{ controller.abort(); }catch(e){} }, 5000) : null;
      try{
        const res = await fetch(`/api/wx_alert?${params.toString()}`, { cache:'no-store', signal: controller ? controller.signal : undefined });
        if(!res.ok) throw new Error(`wx_alert_fetch_failed_${res.status}`);
        const data = await res.json();
        if(!data || data.ok === false) throw new Error('wx_alert_invalid_response');
        formalData = data;
      }finally{
        if(timer) clearTimeout(timer);
      }
    }catch(e){
      formalError = e;
    }

    if(formalData && formalData.ok !== false) return { ...formalData, ts: Date.now() };
    if(formalError) throw formalError;
    throw new Error('wx_alert_invalid_response');
  }

  async function ensureHomeWxAlert(){
    if(!isHomeReady()) return;
    if(!locationConsentAllowed()){
      renderHomeWxAlert(null);
      return;
    }

    if(lastAlert && isWxAlertDataActive(lastAlert) && (Date.now() - lastAlertFetchTs < FETCH_INTERVAL)){
      renderHomeWxAlert(lastAlert);
      return;
    }

    if(!lastAlert){
      try{
        const cached = JSON.parse(localStorage.getItem(ALERT_KEY) || 'null');
        if(cached && isWxAlertDataActive(cached) && cached.ts && (Date.now() - cached.ts < FETCH_INTERVAL)){
          lastAlert = cached;
          lastAlertFetchTs = cached.ts;
          renderHomeWxAlert(lastAlert);
          return;
        }
      }catch(e){ /* ignore */ }
    }

    try{
      const c = await getCoords();
      const alertData = await fetchWxAlert(c.lat, c.lon);
      if(isWxAlertDataActive(alertData)){
        lastAlert = alertData;
        lastAlertFetchTs = Date.now();
        try{ localStorage.setItem(ALERT_KEY, JSON.stringify(alertData)); }catch(e){ /* ignore */ }
        renderHomeWxAlert(alertData);
      }else{
        lastAlert = null;
        lastAlertFetchTs = 0;
        try{ localStorage.removeItem(ALERT_KEY); }catch(e){ /* ignore */ }
        renderHomeWxAlert(null);
        if(isLikelyHomeRoute()) scheduleAlertRetry(30000);
      }
    }catch(e){
      if(e && String(e.message || e).indexOf('geolocation_permission_required') >= 0){
        renderHomeWxAlert(null);
        return;
      }
      if(isWxAlertDataActive(lastAlert)){
        renderHomeWxAlert(lastAlert);
      }else{
        try{
          const cached = JSON.parse(localStorage.getItem(ALERT_KEY) || 'null');
          if(isWxAlertDataActive(cached)) renderHomeWxAlert(cached);
          else renderHomeWxAlert(null);
        }catch(e2){ renderHomeWxAlert(null); }
      }
      if(isLikelyHomeRoute()) scheduleAlertRetry(30000);
    }
  }

  function applyHero(wx){
    const hero = document.getElementById('homeHero');
    if(!hero) return;

    const tempEl = document.getElementById('homeWxTemp');
    const descEl = document.getElementById('homeWxDesc');
    const iconEl = document.getElementById('homeWxIcon');

    const temp = (wx && wx.temp != null) ? Number(wx.temp) : null;
    const rawWeatherText = wx ? [wx.condition, wx.weather, wx.description, wx.wf].filter(Boolean).join(' ') : '';
    const bucket = bucketFromKma(wx ? wx.pty : null, wx ? wx.sky : null, temp, rawWeatherText);
    const celestial = getHomeCelestialState(new Date(), wx);
    const showMoonIcon = celestial.isNight && (bucket.fx === 'sunny' || bucket.fx === 'heat');

    if(iconEl){
      iconEl.classList.remove('has-moon-phase');
      if(showMoonIcon){
        iconEl.textContent = celestial.moon.emoji;
        iconEl.setAttribute('aria-label', celestial.moon.label);
      }else{
        iconEl.textContent = bucket.icon;
        iconEl.removeAttribute('aria-label');
      }
    }
    if(descEl) descEl.textContent = bucket.label;
    if(tempEl) tempEl.textContent = (temp != null && isFinite(temp)) ? Number(temp).toFixed(1) : '-';

    hero.classList.remove(...HOME_HERO_WEATHER_CLASSES);
    hero.classList.add(bucket.cls);

    renderHomeHeroFx(bucket, celestial.isNight, celestial.moon);
    if(celestial.isNight) hero.classList.add('wx-night');
    lastHeroCelestialKey = celestial.key;
  }

  async function getCoords(){
    if(!locationConsentAllowed()){
      throw new Error('location_consent_required');
    }

    if(!navigator.geolocation){
      throw new Error('geolocation_not_supported');
    }

    return await new Promise((resolve, reject)=>{
      navigator.geolocation.getCurrentPosition(
        (pos)=>{
          const c = { lat: pos.coords.latitude, lon: pos.coords.longitude, ts: Date.now() };
          try{ localStorage.setItem(GEO_KEY, JSON.stringify(c)); }catch(e){ /* ignore */ }
          resolve({ lat: c.lat, lon: c.lon, source: 'geo' });
        },
        ()=>{
          reject(new Error('geolocation_permission_required'));
        },
        { enableHighAccuracy: false, timeout: 9000, maximumAge: 10 * 60 * 1000 }
      );
    });
  }

  async function fetchWx(lat, lon){
    const url = `/api/wx?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}`;
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) throw new Error(`wx_fetch_failed_${res.status}`);

    const data = await res.json();
    if(!data || data.ok === false) throw new Error('wx_invalid_response');

    const pty = (data && data.pty != null) ? data.pty : (data ? data.ptyFcst : null);
    const sky = (data && data.sky != null) ? data.sky : null;
    const temp = (data && data.temp != null) ? data.temp : (data && data.t1h != null ? data.t1h : null);

    if(temp == null && pty == null && sky == null){
      throw new Error('wx_empty_payload');
    }

    return {
      ts: Date.now(),
      latitude: Number(lat),
      longitude: Number(lon),
      temp,
      humidity: (data && data.humidity != null) ? Number(data.humidity) : null,
      wind: (data && data.wind != null) ? Number(data.wind) : null,
      pty,
      sky
    };
  }

  async function ensureWeather(){
    if(!isHomeReady()){
      if(isLikelyHomeRoute()) scheduleEnsureWeather(120);
      return;
    }

    if(!locationConsentAllowed()){
      renderHomeWeatherBlocked();
      return;
    }

    ensureHomeWxAlert().catch(()=>{});

    // 최근 데이터가 있으면(10분) 재적용만
    if(lastWx && (Date.now() - (lastWx.ts || 0) < FETCH_INTERVAL)){
      applyHero(lastWx);
      return;
    }

    // 위치 권한 거부/철회 시 과거 날씨가 보이지 않도록 저장된 날씨를 먼저 표시하지 않습니다.

    try{
      const c = await getCoords();
      const wx = await fetchWx(c.lat, c.lon);
      lastWx = wx;
      try{ localStorage.setItem(WX_KEY, JSON.stringify(wx)); }catch(e){ /* ignore */ }
      applyHero(wx);
    }catch(err){
      if(err && String(err.message || err).indexOf('geolocation_permission_required') >= 0){
        renderHomeWeatherBlocked();
        return;
      }
      // 네트워크 문제여도 이번 실행에서 받은 정상 값이 있으면 유지
      if(lastWx){
        applyHero(lastWx);
      }else{
        applyHero({ temp:null, pty:null, sky:null });
      }
      if(isLikelyHomeRoute()) scheduleEnsureWeather(15000);
    }
  }

  // 화면 이동(해시 변경) 후에도 즉시 갱신
  window.addEventListener('hashchange', ()=>{
    setTimeout(()=>{ tick(); ensureWeather(); }, 0);
  });

  window.addEventListener('tbm:home-mounted', ()=>{
    setTimeout(()=>{ tick(); ensureWeather(); }, 0);
  });

  window.addEventListener('pageshow', ()=>{
    setTimeout(()=>{ tick(); ensureWeather(); }, 0);
  });

  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden){
      setTimeout(()=>{
        tick();
        if(lastWx && isHomeReady()) applyHero(lastWx);
        ensureWeather();
      }, 0);
    }
  });


  window.addEventListener('tbm:location-consent-changed', ()=>{
    setTimeout(()=>{ tick(); ensureWeather(); }, 0);
  });

  if(document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ()=>{
      tick();
      ensureWeather();
    }, { once:true });
  } else {
    tick();
    ensureWeather();
  }

  setInterval(tick, 1000);
  setInterval(ensureWeather, 60 * 1000);
})();
</script>
